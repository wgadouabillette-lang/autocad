<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meetra camera</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .wrap {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        overflow: hidden;
        background: #1a1a1a;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #1a1a1a;
      }
      video.mirrored {
        transform: scaleX(-1);
      }
      .placeholder {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: #888;
        font: 500 12px/1.2 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <video id="cam" autoplay muted playsinline></video>
      <div id="placeholder" class="placeholder" hidden>Camera</div>
    </div>
    <script>
      const video = document.getElementById("cam");
      const placeholder = document.getElementById("placeholder");
      const params = new URLSearchParams(location.search);
      let mirror = params.get("mirror") !== "0";

      function applyMirror() {
        video.classList.toggle("mirrored", mirror);
      }

      applyMirror();

      window.formaRecordingCamera?.onMirrorChange((next) => {
        mirror = Boolean(next);
        applyMirror();
      });

      async function start() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });
          video.srcObject = stream;
          placeholder.hidden = true;
        } catch {
          video.hidden = true;
          placeholder.hidden = false;
        }
      }

      void start();
    </script>
  </body>
</html>
