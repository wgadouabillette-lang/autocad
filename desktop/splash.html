<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <title>Meetra</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .window {
        position: relative;
        box-sizing: border-box;
        width: 300px;
        height: 425px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.35);
        -webkit-app-region: drag;
      }
      .brand {
        position: absolute;
        left: 16px;
        top: 12px;
        color: #c8c8c8;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.025em;
      }
      .spinner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 32px;
        height: 32px;
        margin: -16px 0 0 -16px;
        border-radius: 50%;
        border: 2px solid #2a2a2a;
        border-top-color: rgb(200 200 200 / 0.85);
        animation: spin 0.75s linear infinite;
      }
      .footer {
        position: absolute;
        right: 0;
        bottom: 16px;
        left: 0;
        text-align: center;
        color: #737373;
        font-size: 10px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="brand">Meetra</div>
      <div class="spinner" role="progressbar" aria-label="Loading…"></div>
      <div class="footer">Powered by GB Studio</div>
    </div>
  </body>
</html>
