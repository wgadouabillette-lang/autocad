<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <title>Meetra</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .window {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 340px;
        height: 340px;
        padding: 0 16px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.35);
        -webkit-app-region: drag;
        text-align: center;
      }
      .title {
        margin: 0;
        color: #f0f0f0;
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1;
        transform: translateY(-12px);
      }
      .subtitle {
        margin: 10px 0 0;
        max-width: 15.5rem;
        color: #fff;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.375;
        transform: translateY(-12px);
      }
      .progress {
        position: relative;
        width: 9.5rem;
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #333;
        transform: translateY(32px);
      }
      .progress-fill {
        height: 100%;
        width: 36%;
        border-radius: inherit;
        background: rgb(200 200 200 / 0.85);
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress-fill {
          animation: none;
          width: 55%;
        }
      }
    </style>
  </head>
  <body>
    <div class="window">
      <h1 class="title">Meetra</h1>
      <p class="subtitle">AI-powered collaborative workspace for teams</p>
      <div class="progress" role="progressbar" aria-label="Loading…" aria-busy="true">
        <div class="progress-fill"></div>
      </div>
    </div>
  </body>
</html>
