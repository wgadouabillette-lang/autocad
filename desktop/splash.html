<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <title>Meetra</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .window {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 250px;
        height: 300px;
        padding: 0 16px 36px;
        overflow: hidden;
        background: #171717;
        border: 1px solid #333;
        border-radius: 22px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.35);
        -webkit-app-region: drag;
        text-align: center;
      }
      .window::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #1a1a1a;
        clip-path: polygon(100% 0, 100% 100%, 0 100%);
        pointer-events: none;
      }
      .title {
        margin: 0;
        color: #f0f0f0;
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1;
        transform: translateY(-12px);
      }
      .subtitle {
        margin: 10px 0 0;
        max-width: 15.5rem;
        color: #fff;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.375;
        transform: translateY(-12px);
      }
      .progress {
        position: relative;
        width: 9.5rem;
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #333;
        transform: translateY(32px);
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: rgb(200 200 200 / 0.85);
      }
      .version {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        margin: 0;
        color: #666;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1;
        text-align: center;
        font-variant-numeric: tabular-nums;
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <h1 class="title">Meetra</h1>
      <div class="progress" role="progressbar" aria-label="Loading…" aria-busy="true" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill"></div>
      </div>
      <p class="version" id="version"></p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var version = params.get("v") || "0.1.13";
        var versionEl = document.getElementById("version");
        if (versionEl) versionEl.textContent = version;

        var fill = document.querySelector(".progress-fill");
        var bar = document.querySelector(".progress");
        if (!fill) return;
        var start = performance.now();
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var cap = 90;
        var tau = reduce ? 900 : 2200;
        function tick(now) {
          var pct = cap * (1 - Math.exp(-(now - start) / tau));
          fill.style.width = pct.toFixed(2) + "%";
          if (bar) bar.setAttribute("aria-valuenow", String(Math.round(pct)));
          window.requestAnimationFrame(tick);
        }
        window.requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
