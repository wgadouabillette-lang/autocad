name: Release macOS Desktop

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Hall (.dmg)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FORMA_PROD_BUILD: "1"
      EVS_NO_ASK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the app cannot stay stuck on the splash
        run: node scripts/check-desktop-boot.cjs

      - name: Validate Castlabs EVS secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Secret $name manquant."
              missing=1
            fi
          }
          check "EVS_ACCOUNT_NAME" "${{ secrets.EVS_ACCOUNT_NAME }}"
          check "EVS_PASSWD" "${{ secrets.EVS_PASSWD }}"
          check "CSC_LINK (Developer ID .p12)" "${{ secrets.CSC_LINK }}"
          check "CSC_KEY_PASSWORD" "${{ secrets.CSC_KEY_PASSWORD }}"
          check "APPLE_API_KEY" "${{ secrets.APPLE_API_KEY }}"
          check "APPLE_API_KEY_ID" "${{ secrets.APPLE_API_KEY_ID }}"
          check "APPLE_API_ISSUER" "${{ secrets.APPLE_API_ISSUER }}"
          if [[ "$missing" -ne 0 ]]; then
            echo ""
            echo "Configurez Castlabs EVS + Developer ID + notarisation Apple, puis relancez."
            echo "Sans Developer ID, macOS bloque le .dmg comme non vérifié."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install castlabs-evs
        run: python -m pip install --upgrade pip castlabs-evs pillow

      - name: Refresh EVS authorization
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: python -m castlabs_evs.account refresh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-cad.txt

      - name: Generate app icon
        run: python scripts/generate-app-icon.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare desktop resources
        env:
          FORMA_BACKEND_ENV: ${{ secrets.FORMA_BACKEND_ENV }}
          VITE_FIREBASE_API_KEY: AIzaSyCEgeoE7cOh8OA1l2rQSF0VTJ0pY1GYgx4
          VITE_FIREBASE_AUTH_DOMAIN: forma-cad-dev.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: forma-cad-dev
          VITE_FIREBASE_STORAGE_BUCKET: forma-cad-dev.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "341690938979"
          VITE_FIREBASE_APP_ID: 1:341690938979:web:e44bbe2e180e0b1cdaea56
          VITE_FIREBASE_FUNCTIONS_REGION: northamerica-northeast1
          VITE_FORMA_WEB_AUTH_URL: https://meetra.cc/app/auth.html
          VITE_FORMA_API_URL: https://meetra.cc
        run: node scripts/prepare-desktop-resources.cjs

      - name: Install Apple API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build signed + notarized macOS app
        working-directory: desktop
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --universal --publish never

      - name: Prepare stable download filename
        run: |
          chmod +x scripts/prepare-landing-downloads.sh
          ./scripts/prepare-landing-downloads.sh
          test -f landing/public/downloads/meetra.dmg
          ls -lh landing/public/downloads/meetra.dmg desktop/release/*.dmg

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.yml
            landing/public/downloads/meetra.dmg
          fail_on_unmatched_files: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hall-mac-dmg
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            landing/public/downloads/meetra.dmg
          if-no-files-found: error
          retention-days: 30
