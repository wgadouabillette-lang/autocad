name: Release macOS Desktop

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Hall (.dmg)
    runs-on: macos-14
    timeout-minutes: 90
    env:
      FORMA_PROD_BUILD: "1"
      EVS_NO_ASK: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Castlabs EVS secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Secret $name manquant."
              missing=1
            fi
          }
          check "EVS_ACCOUNT_NAME" "${{ secrets.EVS_ACCOUNT_NAME }}"
          check "EVS_PASSWD" "${{ secrets.EVS_PASSWD }}"
          if [[ "$missing" -ne 0 ]]; then
            echo ""
            echo "Configurez les secrets Castlabs EVS puis relancez le workflow."
            echo "Guide : docs/DESKTOP.md section « Spotify (lecture complète Premium) » / macOS CI"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install castlabs-evs
        run: python -m pip install --upgrade pip castlabs-evs pillow

      - name: Refresh EVS authorization
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: python -m castlabs_evs.account refresh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-cad.txt

      - name: Generate app icon
        run: python scripts/generate-app-icon.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare desktop resources
        env:
          FORMA_BACKEND_ENV: ${{ secrets.FORMA_BACKEND_ENV }}
          VITE_FIREBASE_API_KEY: AIzaSyCEgeoE7cOh8OA1l2rQSF0VTJ0pY1GYgx4
          VITE_FIREBASE_AUTH_DOMAIN: forma-cad-dev.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: forma-cad-dev
          VITE_FIREBASE_STORAGE_BUCKET: forma-cad-dev.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "341690938979"
          VITE_FIREBASE_APP_ID: 1:341690938979:web:e44bbe2e180e0b1cdaea56
          VITE_FIREBASE_FUNCTIONS_REGION: northamerica-northeast1
        run: node scripts/prepare-desktop-resources.cjs

      - name: Build macOS app (universal dir)
        working-directory: desktop
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: npx electron-builder --mac dir --universal --publish never

      - name: Ad-hoc sign + rebuild .dmg
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          chmod +x scripts/fix-mac-app-sign.sh
          ./scripts/fix-mac-app-sign.sh

      - name: Prepare stable download filename
        run: |
          chmod +x scripts/prepare-landing-downloads.sh
          ./scripts/prepare-landing-downloads.sh
          test -f landing/public/downloads/Hall-mac.dmg
          ls -lh landing/public/downloads/Hall-mac.dmg desktop/release/*.dmg

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.yml
            landing/public/downloads/Hall-mac.dmg
          fail_on_unmatched_files: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hall-mac-dmg
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            landing/public/downloads/Hall-mac.dmg
          if-no-files-found: error
          retention-days: 30
