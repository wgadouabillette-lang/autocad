name: Release Linux Desktop

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Hall (.AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FORMA_PROD_BUILD: "1"
      EVS_NO_ASK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Castlabs EVS secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Secret $name manquant."
              missing=1
            fi
          }
          check "EVS_ACCOUNT_NAME" "${{ secrets.EVS_ACCOUNT_NAME }}"
          check "EVS_PASSWD" "${{ secrets.EVS_PASSWD }}"
          if [[ "$missing" -ne 0 ]]; then
            echo ""
            echo "Configurez les secrets Castlabs EVS puis relancez le workflow."
            echo "Guide : docs/DESKTOP.md section « Spotify (lecture complète Premium) » / Linux CI"
            exit 1
          fi

      - name: Install AppImage / packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install castlabs-evs
        run: python -m pip install --upgrade pip castlabs-evs pillow

      - name: Refresh EVS authorization
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: python -m castlabs_evs.account refresh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-cad.txt

      - name: Generate app icon
        run: python scripts/generate-app-icon.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare desktop resources
        env:
          FORMA_BACKEND_ENV: ${{ secrets.FORMA_BACKEND_ENV }}
          VITE_FIREBASE_API_KEY: AIzaSyCEgeoE7cOh8OA1l2rQSF0VTJ0pY1GYgx4
          VITE_FIREBASE_AUTH_DOMAIN: forma-cad-dev.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: forma-cad-dev
          VITE_FIREBASE_STORAGE_BUCKET: forma-cad-dev.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "341690938979"
          VITE_FIREBASE_APP_ID: 1:341690938979:web:e44bbe2e180e0b1cdaea56
          VITE_FIREBASE_FUNCTIONS_REGION: northamerica-northeast1
          VITE_FORMA_WEB_AUTH_URL: https://meetra.cc/app/auth.html
          VITE_FORMA_API_URL: https://meetra.cc
        run: node scripts/prepare-desktop-resources.cjs

      - name: Build Linux AppImage
        working-directory: desktop
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: npx electron-builder --linux AppImage --publish never

      - name: Prepare stable download filename
        run: |
          mkdir -p landing/downloads landing/public/downloads
          APPIMAGE="$(ls -1t desktop/release/Meetra-*-linux.AppImage desktop/release/Hall-*-linux.AppImage desktop/release/*.AppImage 2>/dev/null | head -1 || true)"
          if [[ -z "$APPIMAGE" || ! -f "$APPIMAGE" ]]; then
            echo "AppImage introuvable dans desktop/release/"
            ls -la desktop/release || true
            exit 1
          fi
          cp -f "$APPIMAGE" landing/public/downloads/Meetra-linux.AppImage
          cp -f "$APPIMAGE" landing/downloads/Meetra-linux.AppImage
          chmod +x landing/public/downloads/Meetra-linux.AppImage
          ls -lh landing/public/downloads/Meetra-linux.AppImage "$APPIMAGE"

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.AppImage
            desktop/release/*.yml
            desktop/release/*.blockmap
            landing/public/downloads/Meetra-linux.AppImage
          fail_on_unmatched_files: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meetra-linux-AppImage
          path: |
            desktop/release/*.AppImage
            desktop/release/latest-linux.yml
            desktop/release/*.blockmap
            landing/public/downloads/Meetra-linux.AppImage
          if-no-files-found: error
          retention-days: 30
