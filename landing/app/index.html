<!doctype html>
<html lang="en" class="app-loading-splash">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00000000" />
    <meta name="color-scheme" content="only light" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <title>Meetra</title>
    <style>
      html.app-loading-splash,
      html.app-loading-splash body,
      html.app-loading-splash #root {
        background: transparent !important;
        color-scheme: only light !important;
        height: 100%;
        margin: 0;
      }
      html.app-loading-splash body {
        overflow: hidden;
      }
      .app-loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .app-loading-screen__window {
        position: relative;
        display: flex;
        width: 340px;
        height: 340px;
        flex-shrink: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.35);
        -webkit-app-region: drag;
      }
      .app-loading-screen__card {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        padding: 0 16px;
        text-align: center;
      }
      .app-loading-screen__title {
        margin: 0;
        color: #f0f0f0;
        font: 600 2.5rem/1 system-ui, sans-serif;
        letter-spacing: -0.025em;
        transform: translateY(-12px);
      }
      .app-loading-screen__subtitle {
        margin: 10px 0 0;
        max-width: 15.5rem;
        color: #fff;
        font: 400 11px/1.375 system-ui, sans-serif;
        transform: translateY(-12px);
      }
      .app-loading-screen__progress {
        position: relative;
        width: 9.5rem;
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #333;
        transform: translateY(32px);
      }
      .app-loading-screen__progress-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: rgb(200 200 200 / 0.85);
      }
    </style>
    <script type="module" crossorigin src="/app/assets/main-kG3JQMtU.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/resolveAuthDomain-als4YcJH.js">
    <link rel="modulepreload" crossorigin href="/app/assets/index-CAOom9bW.js">
    <link rel="modulepreload" crossorigin href="/app/assets/workspaceIcon-BtfF3Jjt.js">
    <link rel="modulepreload" crossorigin href="/app/assets/recordingMedia-BvsbWYnc.js">
    <link rel="stylesheet" crossorigin href="/app/assets/index-cO_4UFj3.css">
  </head>
  <body>
    <div id="root">
      <div class="app-loading-screen" role="status">
        <div class="app-loading-screen__window">
          <div class="app-loading-screen__card">
            <h1 class="app-loading-screen__title">Meetra</h1>
            <p class="app-loading-screen__subtitle">AI-powered collaborative workspace for teams</p>
            <div
              class="app-loading-screen__progress app-loading-screen__progress--indeterminate"
              role="progressbar"
              aria-label="Loading…"
              aria-busy="true"
            >
              <div class="app-loading-screen__progress-fill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var fill = document.querySelector(".app-loading-screen__progress-fill");
        if (!fill) return;
        var start = performance.now();
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var cap = 90;
        var tau = reduce ? 900 : 2200;
        function tick(now) {
          if (!fill.isConnected) return;
          var pct = cap * (1 - Math.exp(-(now - start) / tau));
          fill.style.width = pct.toFixed(2) + "%";
          window.requestAnimationFrame(tick);
        }
        window.requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
